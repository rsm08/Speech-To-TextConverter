
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech-to-Text Converter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" type="image" href="fav2.jpeg"> 

    <style>
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: url("bg3.jpg") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        h1 {
            color: #00c3ff;
            font-size: 2.2rem;
            text-shadow: 2px 2px 8px rgba(0, 195, 255, 0.6);
        }

        .para1 {
            font-size: 1.2rem;
            color: #d0eaff;
            margin-bottom: 1.5rem;
        }

        /* Container Styles */
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.3);
            width: 80%;
            max-width: 450px;
            text-align: center;
        }

        /* Button Styles */
        button {
            background: linear-gradient(45deg, #007bff, #00c3ff);
            color: white;
            border: none;
            padding: 0.8rem 1.2rem;
            margin: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease-in-out;
        }

        button:hover {
            background: linear-gradient(45deg, #00c3ff, #007bff);
            transform: scale(1.05);
        }

        /* Speech Output Box */
        p.para {
            background: #1e1e1e;
            color: #00c3ff;
            padding: 1rem;
            border-radius: 6px;
            height: 80px;
            margin-top: 1rem;
            text-align: left;
            overflow-y: auto;
            font-size: 1rem;
        }

        /* Icons */
        .mic-icon {
            color: red;  
            margin-right: 8px;
        }

        .pause {
            color: yellow;
            margin-right: 8px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .para1 {
                font-size: 1rem;
            }

            button {
                width: 100%;
                padding: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <h1>Speech-to-Text Converter</h1>
    <p class="para1">Convert your speech into text in real-time using voice recognition technology.<br> Click 'Start Listening' and begin speaking.</p>
    
    <div class="container">
        <button id="start"><i class="fa-solid fa-microphone mic-icon"></i> Start Listening</button>
        <button id="stop"><i class="fa-solid fa-stop pause"></i> Stop</button>
        <p class="para" id="output">Your speech will appear here...</p>
    </div>

    <script>
        const startBtn = document.getElementById("start");
        const stopBtn = document.getElementById("stop");
        const output = document.getElementById("output");

        let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.continuous = true;
        recognition.lang = "en-US";

        recognition.onresult = function(event) {
            let transcript = event.results[event.results.length - 1][0].transcript;
            output.textContent = transcript;
        };

        startBtn.addEventListener("click", () => {
            recognition.start();
            output.textContent = "Listening...";
        });

        stopBtn.addEventListener("click", () => {
            recognition.stop();
            output.textContent = "Stopped listening.";
        });
    </script>
</body>
</html>
